This is a complete HTML document that creates a realistic, interactive 3D ATM card design you can view directly in your browser.
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Thẻ ATM 3D | Thiết kế hiện đại</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #1a1e2b 0%, #2a2f3f 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
      padding: 20px;
      margin: 0;
    }

    /* Hiệu ứng nền động nhẹ */
    .background-glow {
      position: fixed;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, transparent 70%);
      top: -100px;
      right: -100px;
      border-radius: 50%;
      filter: blur(60px);
      z-index: 0;
      pointer-events: none;
    }

    .card-container {
      perspective: 1200px;
      width: 460px;
      max-width: 100%;
      height: 280px;
      position: relative;
      z-index: 2;
    }

    /* Thẻ chính */
    .atm-card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      border-radius: 20px;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6), 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    /* Hiệu ứng lật khi hover (tùy chọn) */
    .card-container:hover .atm-card {
      transform: rotateY(8deg) rotateX(5deg);
    }

    /* Mặt trước thẻ */
    .card-front {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 20px;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.08) 0%, transparent 40%),
        linear-gradient(160deg, #2d3748 0%, #1a202c 70%, #0b0f19 100%);
      padding: 28px 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    /* Họa tiết nền bổ sung */
    .card-front::before {
      content: "";
      position: absolute;
      top: -50px;
      right: -50px;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      z-index: 0;
    }

    .card-front::after {
      content: "";
      position: absolute;
      bottom: -60px;
      left: -40px;
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.2) 0%, transparent 70%);
      border-radius: 50%;
      z-index: 0;
    }

    /* Các phần tử bên trong xếp trên nền */
    .card-header, .card-body, .card-footer {
      position: relative;
      z-index: 2;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bank-logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
      color: #0f172a;
      box-shadow: 0 8px 15px rgba(251, 191, 36, 0.3);
    }

    .bank-name {
      font-weight: 600;
      font-size: 1.2rem;
      letter-spacing: 0.5px;
      color: #f1f5f9;
    }

    .card-type {
      font-weight: 600;
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 5px 14px;
      border-radius: 30px;
      color: #facc15;
      letter-spacing: 0.8px;
      border: 1px solid rgba(250, 204, 21, 0.3);
    }

    .chip-section {
      display: flex;
      align-items: center;
      gap: 15px;
      margin: 10px 0 5px;
    }

    .chip {
      width: 50px;
      height: 38px;
      background: linear-gradient(145deg, #d4af37, #b7932a);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,200,0.6);
      position: relative;
    }

    .chip::after {
      content: "";
      width: 32px;
      height: 24px;
      background: repeating-linear-gradient(90deg, #a68b1c 0px, #a68b1c 3px, #e4c45a 3px, #e4c45a 6px);
      border-radius: 3px;
    }

    .contactless-icon {
      font-size: 24px;
      color: #94a3b8;
      transform: rotate(90deg);
      opacity: 0.8;
    }

    .card-number {
      font-family: 'Courier New', 'Fira Code', monospace;
      font-size: 1.9rem;
      font-weight: 500;
      letter-spacing: 4px;
      word-spacing: 10px;
      color: #f8fafc;
      text-shadow: 0 2px 5px rgba(0,0,0,0.5);
      margin: 5px 0 2px;
      display: flex;
      justify-content: space-between;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 5px;
    }

    .holder-info {
      display: flex;
      flex-direction: column;
    }

    .label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #94a3b8;
      font-weight: 500;
    }

    .value {
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: 0.6px;
      color: #e2e8f0;
      text-transform: uppercase;
    }

    .expiry-cvv {
      display: flex;
      gap: 25px;
      align-items: flex-end;
    }

    .network-logo {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .circle-red {
      width: 28px;
      height: 28px;
      background: #ef4444;
      border-radius: 50%;
      opacity: 0.9;
    }

    .circle-yellow {
      width: 28px;
      height: 28px;
      background: #f59e0b;
      border-radius: 50%;
      margin-left: -12px;
      opacity: 0.9;
    }

    .network-text {
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: 1px;
      margin-left: 5px;
      color: #cbd5e1;
    }

    /* Hiệu ứng ánh sáng quét */
    .shine {
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
      transform: skewX(-20deg);
      transition: left 0.8s ease;
      z-index: 5;
      pointer-events: none;
    }

    .card-container:hover .shine {
      left: 120%;
    }

    /* Thông tin bổ sung bên ngoài */
    .card-description {
      text-align: center;
      margin-top: 25px;
      color: #9ca3af;
      font-size: 0.9rem;
      font-weight: 400;
      letter-spacing: 0.4px;
      z-index: 2;
      position: relative;
    }

    @media (max-width: 480px) {
      .card-container {
        width: 100%;
        height: 250px;
      }
      .card-front {
        padding: 20px 22px;
      }
      .card-number {
        font-size: 1.5rem;
        letter-spacing: 3px;
      }
    }
  </style>
</head>
<body>
  <div class="background-glow"></div>
  
  <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
    <div class="card-container">
      <div class="atm-card">
        <!-- Mặt trước thẻ ATM -->
        <div class="card-front">
          <div class="shine"></div>
          
          <div class="card-header">
            <div class="bank-logo">
              <div class="logo-icon">V</div>
              <span class="bank-name">VIBANK</span>
            </div>
            <div class="card-type">PLATINUM</div>
          </div>

          <div class="card-body">
            <div class="chip-section">
              <div class="chip"></div>
              <span class="contactless-icon">📶</span>
            </div>
            <div class="card-number">
              <span>4856</span>
              <span>9210</span>
              <span>3782</span>
              <span>1045</span>
            </div>
          </div>

          <div class="card-footer">
            <div class="holder-info">
              <span class="label">Chủ thẻ</span>
              <span class="value">NGUYEN VAN A</span>
            </div>
            <div class="expiry-cvv">
              <div>
                <span class="label">Hiệu lực</span>
                <span class="value">12/28</span>
              </div>
            </div>
            <div class="network-logo">
              <div class="circle-red"></div>
              <div class="circle-yellow"></div>
              <span class="network-text">Mastercard</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-description">
      ✦ Thẻ ATM • Thiết kế 3D tương tác ✦
    </div>
  </div>
</body>
</html>
